name: Build macOS app

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Package app
        run: bash scripts/package-app.sh
      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mac-AI-Memory-Manager-macOS-arm64
          path: dist/*.zip
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "Mac AI Memory Manager $GITHUB_REF_NAME" --generate-notes
